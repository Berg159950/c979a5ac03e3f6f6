name: build-bun-penryn-win

on:
  workflow_dispatch:
    inputs:
      bun_tag:
        description: Bun tag to build (empty = latest stable release)
        required: false
        default: ""

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

env:
  BUN_TAG: ${{ github.event.inputs.bun_tag }}

jobs:
  check-version:
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve Bun tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$BUN_TAG" ]; then
            TAG="$BUN_TAG"
          else
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/oven-sh/bun/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+' | head -1)
          fi
          [ -n "$TAG" ] || { echo "Failed to resolve Bun tag"; exit 1; }
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          VER="${TAG#bun-v}"
          VER="${VER#v}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Using Bun tag: $TAG -> version $VER"

  build:
    needs: check-version
    runs-on: windows-2022
    outputs:
      bun_version: ${{ needs.check-version.outputs.version }}
      bun_sha256: ${{ steps.sha256.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore intermediate bun binary
        id: restore
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: build-bun-win.yml
          name: stage-bun-win-x64-${{ needs.check-version.outputs.version }}-${{ hashFiles('.github/workflows/build-bun-win.yml') }}
          path: ${{ runner.temp }}/stage
          if-no-artifact-found: warn

      - name: Restore source cache
        id: src-cache
        if: steps.restore.outputs.found_artifact != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bun-src
          key: src-bun-win-${{ needs.check-version.outputs.version }}

      - name: Restore download cache
        id: dl-cache
        if: steps.restore.outputs.found_artifact != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dl-cache
          key: dl-bun-win

      - name: Setup MSVC env
        if: steps.restore.outputs.found_artifact != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install system deps
        if: steps.restore.outputs.found_artifact != 'true'
        run: |
          choco install -y ninja ccache nasm
          mkdir -p /tmp/llvm-dl "$RUNNER_TEMP/dl-cache"
          if [ -s "$RUNNER_TEMP/dl-cache/llvm.tar.xz" ]; then
            echo "LLVM tarball restored from cache"
            cp "$RUNNER_TEMP/dl-cache/llvm.tar.xz" /tmp/llvm-dl/llvm.tar.xz
          else
            for i in 1 2 3; do
              curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/clang%2Bllvm-21.1.8-x86_64-pc-windows-msvc.tar.xz" -o /tmp/llvm-dl/llvm.tar.xz && break
              echo "LLVM download attempt $i failed"
              rm -f /tmp/llvm-dl/llvm.tar.xz
              [ $i -lt 3 ] && sleep 30
            done
            [ -s /tmp/llvm-dl/llvm.tar.xz ] || { echo "LLVM download failed"; exit 1; }
            cp /tmp/llvm-dl/llvm.tar.xz "$RUNNER_TEMP/dl-cache/llvm.tar.xz"
          fi
          rm -rf /c/llvm
          mkdir -p /c/llvm
          tar xf /tmp/llvm-dl/llvm.tar.xz -C /c/llvm --strip-components=1
          rm -rf /tmp/llvm-dl
          echo "LLVM tree:"
          ls /c/llvm | head
          ls /c/llvm/bin/clang-cl.exe || { echo "ERROR: clang-cl.exe missing, tree:"; find /c/llvm -maxdepth 3 -name "clang-cl*" 2>/dev/null | head; exit 1; }
          echo "C:/llvm/bin" >> $GITHUB_PATH
          export PATH="C:/llvm/bin:$PATH"
          clang-cl --version | head -2

      - name: Install nasm
        if: steps.restore.outputs.found_artifact != 'true'
        run: |
          NASM_EXE=""
          for d in "/c/ProgramData/chocolatey/bin" "/c/Program Files/NASM" "/c/Program Files/nasm"; do
            if [ -x "$d/nasm.exe" ]; then NASM_EXE="$d/nasm.exe"; break; fi
          done
          if [ -z "$NASM_EXE" ]; then
            echo "nasm not on PATH, inspecting choco lib..."
            ls /c/ProgramData/chocolatey/lib/ 2>/dev/null | grep -i nasm || true
            NASM_EXE=$(find /c/ProgramData/chocolatey/lib -maxdepth 3 -name "nasm.exe" 2>/dev/null | head -1 || true)
          fi
          if [ -z "$NASM_EXE" ]; then
            echo "installing nasm via winget..."
            powershell -NoProfile -Command "winget install -e --id NASM.NASM --accept-package-agreements --accept-source-agreements --silent"
            NASM_EXE=$(find "/c/Program Files" -maxdepth 2 -name "nasm.exe" 2>/dev/null | head -1 || true)
          fi
          [ -n "$NASM_EXE" ] || { echo "ERROR: nasm unavailable"; exit 1; }
          echo "Using nasm at $NASM_EXE"
          cp "$NASM_EXE" /c/llvm/bin/nasm.exe
          export PATH="/c/llvm/bin:$PATH"
          nasm -v

      - name: Setup ccache
        if: steps.restore.outputs.found_artifact != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bun-penryn-win-${{ needs.check-version.outputs.version }}
          restore-keys: |
            bun-penryn-win-
          max-size: 3G

      - name: Setup Bun (for build script)
        if: steps.restore.outputs.found_artifact != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone Bun
        if: steps.restore.outputs.found_artifact != 'true'
        run: |
          SRC="$RUNNER_TEMP/bun-src"
          clone_fresh() {
            rm -rf "$SRC"
            for i in 1 2 3; do
              git clone --depth 1 https://github.com/oven-sh/bun.git "$SRC" && break
              [ $i -lt 3 ] && sleep 10
            done
            [ -d "$SRC/.git" ] || exit 1
          }
          if [ -d "$SRC/.git" ]; then
            echo "reusing cached bun source"
            cd "$SRC"
            if ! git fetch --depth 1 origin ${{ needs.check-version.outputs.tag }}; then
              echo "fetch failed, recloning"
              clone_fresh
              cd "$SRC"
              for i in 1 2 3; do
                git fetch --depth 1 origin ${{ needs.check-version.outputs.tag }} && break
                [ $i -lt 3 ] && sleep 10
              done
            fi
          else
            clone_fresh
            cd "$SRC"
            for i in 1 2 3; do
              git fetch --depth 1 origin ${{ needs.check-version.outputs.tag }} && break
              [ $i -lt 3 ] && sleep 10
            done
          fi
          git checkout FETCH_HEAD
          rm -rf "$SRC/build" "$SRC/dist"
          echo "BUN_SRC=$SRC" >> $GITHUB_ENV

      - name: Resolve WebKit version from Bun source
        if: steps.restore.outputs.found_artifact != 'true'
        id: webkit
        run: |
          cd "$BUN_SRC"
          WEBKIT_VER=""
          for f in scripts/build/deps/webkit.ts scripts/build/deps/webkit.js vendor/webkit-version.txt .github/workflows/*.yml; do
            if [ -f "$f" ]; then
              WEBKIT_VER=$(grep -oE '[0-9a-f]{40}' "$f" | head -1)
              [ -n "$WEBKIT_VER" ] && break
            fi
          done
          if [ -z "$WEBKIT_VER" ]; then
            WEBKIT_VER=$(grep -r "oven-sh/WebKit" --include="*.ts" --include="*.js" --include="*.json" . 2>/dev/null | grep -oE '[0-9a-f]{40}' | head -1)
          fi
          [ -z "$WEBKIT_VER" ] && WEBKIT_VER="549170099226f816a4b204ea1d8fa102fb79eefa"
          echo "version=$WEBKIT_VER" >> $GITHUB_OUTPUT
          echo "Resolved WebKit version: $WEBKIT_VER"

      - name: Apply Penryn patch
        if: steps.restore.outputs.found_artifact != 'true'
        run: |
          cd "$BUN_SRC"
          sed -i 's/-march=nehalem/-march=penryn/g' scripts/build/flags.ts
          perl -0pi -e 's/export const globalFlags: Flag\[\] = \[/export const globalFlags: Flag[] = [\n  {\n    flag: ["-mno-sse4.2", "-mno-popcnt"],\n    when: c => c.x64,\n    desc: "Penryn baseline: no SSE4.2\/POPCNT",\n  },/' scripts/build/flags.ts
          grep -q 'mno-sse4.2' scripts/build/flags.ts || { echo "ERROR: globalFlags patch failed"; exit 1; }
          { grep -rl "HWY_DISABLED_TARGETS" scripts/ || true; } | while read f; do
            perl -pi -e 's/HWY_DISABLED_TARGETS=[^"'"'"'\s,\]]+/HWY_DISABLED_TARGETS=3032/g' "$f"
            perl -pi -e 's/HWY_ALL_SVE-HWY_SVE2_128/3032/g' "$f"
          done
          if ! grep -rq "HWY_DISABLED_TARGETS=3032" scripts/; then
            perl -pi -e 's/"-mno-popcnt"/"-mno-popcnt", "-DHWY_DISABLED_TARGETS=3032"/' scripts/build/flags.ts
          fi
          echo "HWY values in use:"
          grep -rho "HWY_DISABLED_TARGETS=[^\"' ,;]*" scripts/ | sort -u
          sed -i 's/-Ctarget-cpu=nehalem/-Ctarget-cpu=penryn/g' scripts/build/rust.ts
          sed -i 's/"nehalem"/"penryn"/g' scripts/build/rust.ts
          sed -i 's/Nehalem/Penryn/g' scripts/verify-baseline.ts
          sed -i 's/NEHALEM_ALLOWED/PENRYN_ALLOWED/g' scripts/verify-baseline-static/src/main.rs
          sed -i 's/nehalem/penryn/g' scripts/verify-baseline-static/src/main.rs
          find . -name "CMakeLists.txt" -exec sed -i 's/-march=nehalem/-march=penryn/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i 's/target-cpu=nehalem/target-cpu=penryn/g' {} +
          bun -e "const fs=require('fs');let l=fs.readFileSync('scripts/build/deps/zlib.ts','utf8').split('\n');l.splice(78,22);fs.writeFileSync('scripts/build/deps/zlib.ts',l.join('\n'))"
          { grep -rl --include="*.ts" "nehalem" scripts/ test/ || true; } | while read f; do
            sed -i 's/\bnehalem\b/penryn/g; s/\bNehalem\b/Penryn/g; s/\bNEHALEM\b/PENRYN/g' "$f"
          done
          grep -rn --include="CMakeLists.txt" --include="*.ts" --include="*.rs" --exclude-dir=test --exclude-dir=.git "march=nehalem\|target-cpu=nehalem" . && { echo "ERROR: Nehalem still present!"; exit 1; } || echo "All Nehalem references patched successfully"

      - name: Clone WebKit (required for --webkit=local)
        if: steps.restore.outputs.found_artifact != 'true'
        run: |
          mkdir -p "$BUN_SRC/vendor"
          if [ -d "$BUN_SRC/vendor/WebKit/.git" ]; then
            echo "reusing cached WebKit source"
          else
            rm -rf "$BUN_SRC/vendor/WebKit"
            for i in 1 2 3; do
              git clone --depth 1 https://github.com/oven-sh/WebKit.git "$BUN_SRC/vendor/WebKit" && break
              [ $i -lt 3 ] && sleep 10
            done
            [ -d "$BUN_SRC/vendor/WebKit/.git" ] || exit 1
          fi
          cd "$BUN_SRC/vendor/WebKit"
          for i in 1 2 3; do
            git fetch --depth 1 origin ${{ steps.webkit.outputs.version }} && break
            [ $i -lt 3 ] && sleep 10
          done
          git checkout FETCH_HEAD

      - name: Patch WebKit ps1 tar calls
        if: steps.restore.outputs.found_artifact != 'true'
        run: |
          cd "$BUN_SRC"
          { grep -rl "tar\.exe" vendor/WebKit --include="*.ps1" 2>/dev/null || true; } | while read f; do
            if grep -q "System32.tar.exe" "$f"; then
              echo "already patched: $f"
            else
              sed -i 's/\btar\.exe\b/C:\\Windows\\System32\\tar.exe/g' "$f"
              echo "patched tar in $f"
            fi
          done
          { grep -rl "march=nehalem" vendor/WebKit --include="*.ps1" 2>/dev/null || true; } | while read f; do
            sed -i 's/march=nehalem/march=penryn/g' "$f"
            echo "patched arch in $f"
          done

      - name: Pre-seed ICU tarball (retry)
        if: steps.restore.outputs.found_artifact != 'true'
        run: |
          cd "$BUN_SRC"
          PS1="vendor/WebKit/build-icu.ps1"
          if [ ! -f "$PS1" ]; then
            echo "no build-icu.ps1, skipping pre-seed"
            exit 0
          fi
          URL=$(grep -oE 'https://github.com/unicode-org/icu/releases/download/[^" ]+' "$PS1" | head -1 || true)
          FILE=$(grep -oE '\$ICU_TARBALL = Join-Path \$OutputDir "[^"]+"' "$PS1" | head -1 | cut -d'"' -f2 || true)
          if [ -z "$URL" ] || [ -z "$FILE" ]; then
            echo "ICU URL/tarball not parseable, skipping pre-seed"
            exit 0
          fi
          OUTDIR="build/release/deps/WebKit/icu"
          mkdir -p "$OUTDIR" "$RUNNER_TEMP/dl-cache"
          TARBALL="$OUTDIR/$FILE"
          DL="$RUNNER_TEMP/dl-cache/$(basename "$URL")"
          if [ -s "$DL" ]; then
            echo "ICU tarball restored from cache"
            cp "$DL" "$TARBALL"
          fi
          if [ -s "$TARBALL" ]; then
            echo "ICU tarball already present"
          else
            for i in 1 2 3 4 5; do
              if curl -fsSL "$URL" -o "$TARBALL" && [ -s "$TARBALL" ]; then
                echo "ICU tarball downloaded"
                cp "$TARBALL" "$DL"
                break
              fi
              echo "ICU download attempt $i failed"
              rm -f "$TARBALL"
              [ $i -lt 5 ] && sleep 30
            done
            [ -s "$TARBALL" ] || { echo "ICU download failed: $URL"; exit 1; }
          fi

      - name: Patch WebKit simdutf
        if: steps.restore.outputs.found_artifact != 'true'
        run: |
          cd "$BUN_SRC"
          WD="vendor/WebKit/Source/WTF/wtf/simdutf"
          [ -d "$WD" ] || WD="vendor/WebKit/Source/ThirdParty/simdutf"
          [ -d "$WD" ] || WD="src/simdutf_sys"
          echo "simdutf dir: $WD"
          [ -d "$WD" ] || { echo "ERROR: simdutf dir not found"; exit 1; }
          FILES=$(grep -rl "SIMDUTF_TARGET_WESTMERE" "$WD" 2>/dev/null || true)
          [ -n "$FILES" ] || { echo "ERROR: simdutf sources not found in $WD"; exit 1; }
          for f in $FILES; do
            perl -0pi -e 's/#define SIMDUTF_IMPLEMENTATION_ICELAKE[^\n]*\\\n\s*\(\(SIMDUTF_IS_X86_64\) && \(SIMDUTF_COMPILER_SUPPORTS_VBMI2\)\)/#define SIMDUTF_IMPLEMENTATION_ICELAKE 0/' "$f"
            sed -i 's/#define SIMDUTF_IMPLEMENTATION_HASWELL (SIMDUTF_IS_X86_64)/#define SIMDUTF_IMPLEMENTATION_HASWELL 0/' "$f"
            sed -i 's/#define SIMDUTF_TARGET_WESTMERE SIMDUTF_TARGET_REGION("sse4.2,popcnt")/#define SIMDUTF_TARGET_WESTMERE SIMDUTF_TARGET_REGION("sse4.1")/' "$f"
            sed -i 's/\b_popcnt64\b/__builtin_popcountll/g; s/\b__popcnt64\b/__builtin_popcountll/g; s/\b_popcnt32\b/__builtin_popcount/g; s/\b__popcnt\b/__builtin_popcount/g; s/\b_mm_popcnt_u64\b/__builtin_popcountll/g; s/\b_mm_popcnt_u32\b/__builtin_popcount/g' "$f"
            echo "simdutf patched: $f"
          done
          grep -rn "SIMDUTF_IMPLEMENTATION_HASWELL 1\|SIMDUTF_IMPLEMENTATION_ICELAKE 1" "$WD" 2>/dev/null && { echo "ERROR: haswell/icelake still enabled!"; exit 1; } || echo "simdutf: haswell/icelake disabled OK"
          grep -rn "_popcnt64\|_popcnt32\|__popcnt64\|__popcnt\b\|_mm_popcnt_u64\|_mm_popcnt_u32" "$WD" 2>/dev/null && { echo "ERROR: POPCNT intrinsics still present in simdutf!"; exit 1; } || echo "simdutf: POPCNT intrinsics removed OK"

      - name: Build Bun (with local WebKit)
        if: steps.restore.outputs.found_artifact != 'true'
        run: |
          cd "$BUN_SRC"
          bun run build:release --webkit=local 2>&1

      - name: Attribute POPCNT to objects
        if: steps.restore.outputs.found_artifact != 'true'
        run: |
          OD="/c/llvm/bin/llvm-objdump.exe"
          if [ ! -x "$OD" ]; then
            echo "llvm-objdump not found, skipping attribution"
            exit 0
          fi
          echo "=== objects containing popcnt (top 30) ==="
          find "$BUN_SRC/build" \( -name "*.obj" -o -name "*.lib" -o -name "*.rlib" \) 2>/dev/null | while read o; do
            n=$("$OD" -d "$o" 2>/dev/null | grep -cE '\bpopcnt\b' || true)
            [ "$n" != "0" ] && echo "$n $o"
          done | sort -rn | head -30
          echo "=== attribution done ==="

      - name: Stage built binary
        if: steps.restore.outputs.found_artifact != 'true'
        run: |
          echo "BUN_SRC=$BUN_SRC"
          BUN_BIN=$(find "$BUN_SRC/build" -maxdepth 4 -type f -name "bun.exe" 2>/dev/null | head -1 || true)
          if [ -z "$BUN_BIN" ]; then
            echo "bun.exe not found, build tree:"
            find "$BUN_SRC" -maxdepth 2 -type d 2>/dev/null | head -30
            find "$BUN_SRC" -maxdepth 5 -name "bun*.exe" 2>/dev/null | head -10
            exit 1
          fi
          echo "BUN_BIN=$BUN_BIN" >> $GITHUB_ENV
          mkdir -p "$RUNNER_TEMP/stage"
          cp "$BUN_BIN" "$RUNNER_TEMP/stage/bun.bin.exe"

      - name: Upload intermediate binary
        if: steps.restore.outputs.found_artifact != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage-bun-win-x64-${{ needs.check-version.outputs.version }}-${{ hashFiles('.github/workflows/build-bun-win.yml') }}
          path: ${{ runner.temp }}/stage/bun.bin.exe

      - name: Use restored binary
        if: steps.restore.outputs.found_artifact == 'true'
        run: |
          [ -f "$RUNNER_TEMP/stage/bun.bin.exe" ] || { echo "restored bun.bin.exe missing"; ls -la "$RUNNER_TEMP/stage"; exit 1; }
          echo "BUN_BIN=$RUNNER_TEMP/stage/bun.bin.exe" >> $GITHUB_ENV

      - name: Native verify
        run: |
          "$BUN_BIN" --version

      - name: Static ISA verify (no POPCNT/AVX-512)
        run: |
          DISASM=$(which objdump llvm-objdump 2>/dev/null | head -1 || true)
          if [ -z "$DISASM" ]; then
            echo "WARNING: no objdump available, skipping static ISA verify"
            exit 0
          fi
          "$DISASM" -d "$BUN_BIN" > "$RUNNER_TEMP/disasm.txt" 2>/dev/null
          echo "=== Instruction counts ==="
          for pat in "popcnt" "vpopcntq\|vpopcntd" "vaes" "vzeroupper" "vpbroadcast"; do
            echo "$pat: $(grep -c "\b$pat" "$RUNNER_TEMP/disasm.txt" || true)"
          done
          echo "=== popcnt by symbol (top 30) ==="
          grep -nE '\bpopcnt\b' "$RUNNER_TEMP/disasm.txt" | head -5 || true
          awk '/^0*[0-9a-f]+ </{sym=$0} /\bpopcnt\b/{count[sym]++} END{for (s in count) print count[s], s}' "$RUNNER_TEMP/disasm.txt" | sort -rn | head -30 || true
          if grep -qE '\bpopcnt\b' "$RUNNER_TEMP/disasm.txt"; then
            echo "ERROR: POPCNT instructions still present in binary!"
            grep -nE '\bpopcnt\b' "$RUNNER_TEMP/disasm.txt" | head -20
            exit 1
          fi
          echo "OK: zero POPCNT instructions"
          if grep -qE '\bvpopcntq\b|\bvpopcntd\b' "$RUNNER_TEMP/disasm.txt"; then
            echo "ERROR: AVX-512 VPOPCNT instructions still present in binary!"
            exit 1
          fi
          echo "OK: zero AVX-512 VPOPCNT instructions"

      - name: Bundle exe
        run: |
          mkdir -p "$RUNNER_TEMP/bundle/lib"
          cp "$BUN_BIN" "$RUNNER_TEMP/bundle/bun.bin.exe"
          find "$(dirname "$BUN_BIN")" -maxdepth 1 -name "*.dll" -exec cp -n {} "$RUNNER_TEMP/bundle/lib/" \; 2>/dev/null || true
          printf '@echo off\r\n"%%~dp0bun.bin.exe" %%*\r\n' > "$RUNNER_TEMP/bundle/bun.cmd"
          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")" && pwd)"\nexec "$DIR/bun.bin.exe" "$@"\n' > "$RUNNER_TEMP/bundle/bun"
          chmod +x "$RUNNER_TEMP/bundle/bun"

      - name: Smoke test
        run: |
          "$RUNNER_TEMP/bundle/bun.bin.exe" --version

      - name: Package artifact
        run: |
          rm -f "$RUNNER_TEMP/bun-penryn-win-x64.zip"
          7z a -tzip "$RUNNER_TEMP/bun-penryn-win-x64.zip" "$RUNNER_TEMP/bundle/*"

      - name: Compute SHA256
        id: sha256
        run: |
          SHA=$(sha256sum "$RUNNER_TEMP/bun-penryn-win-x64.zip" | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bun-penryn-win-x64-${{ needs.check-version.outputs.version }}-${{ github.run_id }}
          name: Bun Penryn Win x64 ${{ needs.check-version.outputs.version }}
          body: |
            Bun ${{ needs.check-version.outputs.version }} built for Penryn (SSE 4.1), Windows x64
            SHA256: ${{ steps.sha256.outputs.sha256 }}
          files: ${{ runner.temp }}/bun-penryn-win-x64.zip
          draft: false
          prerelease: false

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: bun-penryn-win-x64
          path: ${{ runner.temp }}/bun-penryn-win-x64.zip
